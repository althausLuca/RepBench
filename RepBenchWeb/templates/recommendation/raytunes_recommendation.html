{% extends "recommendation/recommendation.html" %}
{% load static %}




{% block recommendation_computation %}

    <script>
        $(document).ready(function () {
            let start_url = "{% url 'start_raytunes' %}"
            let retrieve_url = "{%  url 'retrieve_recommendation_results' %}"
            recommendationHandler.init("RayTunes", start_url, retrieve_url)
        })
    </script>

    <div class="col-md-12">
        <div class="row">
            <div class="col-md-8">
                {% include "recommendation/raytunes_chart_and_form.html" %}

            </div>
            <div class="col-md-4">
                <div class="kt-portlet">
                    <div class="kt-portlet__head">
                        <div class="kt-portlet__head-label">
                            <h3 class="kt-portlet__head-title"> Parameter</h3>
                        </div>
                        <div class="kt-portlet__head-toolbar">
                        </div>
                    </div>
                    <div class="kt-portlet__body" style="height:560px">
                        <table id="parameterTable">
                            <thead>
                            <tr>
                                <th>Score</th>
                                <th>Estimator</th>
                                <th>Parameters</th>
                            </tr>
                            </thead>
                            <tbody></tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>


    </div>
{% endblock %}
