version: '3'

services:
  web:
    build: .
    command: gunicorn RepBenchWeb.wsgi:application --bind 0.0.0.0:8000
    volumes:
      - .:/code
      - static_volume:/code/static
      - media_volume:/code/media
    expose:
      - 8000
    depends_on:
      - redis
    environment:
      - DJANGO_SETTINGS_MODULE=RepBenchWeb.settings

  celery:
    build: .
    shm_size: 4294967296
    command: celery -A RepBenchWeb worker --loglevel=info -c 4
    volumes:
      - .:/code
      - static_volume:/code/static
      - media_volume:/code/media
    depends_on:
      - web
      - redis
    environment:
      - DJANGO_SETTINGS_MODULE=RepBenchWeb.settings

  redis:
    image: redis

  nginx:
    build: ./nginx
    volumes:
      - ./nginx/d.conf:/etc/nginx/conf.d/default.conf
      - static_volume:/code/static
      - media_volume:/code/media
    ports:
      - 12006:80
    depends_on:
      - web

volumes:
  static_volume:
  media_volume:
