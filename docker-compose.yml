version: '3'

services:
  web:
    build: .
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - .:/code
    ports:
      - 8000:8000
    depends_on:
      - redis
    environment:
      - REDIS_URL=redis://redis:6379/0
      - DEBUG=0

  celery:
    build: .
    command: celery -A RepBenchWeb worker --loglevel=info
    volumes:
      - .:/code
    depends_on:
      - redis
    environment:
      - REDIS_URL=redis://redis:6379/0
      - DEBUG=0

  redis:
    image: redis
